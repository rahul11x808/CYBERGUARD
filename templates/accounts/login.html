{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERGUARD | Log In</title>
    <link rel="stylesheet" href="{% static 'css/accounts/loging.css' %}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <a href="{% url 'dashboard:index' %}" class="auth-logo">
                <span class="auth-logo-icon">🛡️</span>
                <h1>CYBERGUARD</h1>
            </a>
            <p class="auth-subtitle">Sign in to your cybersecurity workspace</p>
        </div>

        {% if messages %}
        <div class="auth-messages">
            {% for message in messages %}
            <div class="auth-alert {% if message.tags == 'error' %}auth-alert-error{% else %}auth-alert-success{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" class="auth-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="Enter your username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="auth-submit-btn">Log In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{% url 'accounts:register' %}">Sign Up</a>
        </div>
    </div>
</body>
</html>
